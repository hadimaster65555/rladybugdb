# R-hub's generic GitHub Actions workflow file. Its canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

on:
  # Also run the CRAN-relevant Linux platforms on pushes to fix branches,
  # so a check does not need a dispatch token.
  push:
    branches: ['fix/**']
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: summary(rhub::rhub_platforms())
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config || 'linux,gcc16,clang23,ubuntu-clang,ubuntu-next,ubuntu-release' }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
    env:
      # As on CRAN's check machines, keep the output of re-building the
      # vignettes (build_vignettes.log), so sanitizer reports from vignette
      # code can be read back.
      _R_CHECK_ALWAYS_LOG_VIGNETTE_OUTPUT_: true

    steps:
      - uses: r-hub/actions/checkout@v1
      - name: Install xz, which configure uses to unpack the bundled engine
        shell: bash
        run: |
          # CRAN's Linux machines have xz; some minimal R-hub containers (clang23) do not.
          if ! command -v xz > /dev/null 2>&1; then
            sudo=""
            if [ "$(id -u)" -ne 0 ] && command -v sudo > /dev/null 2>&1; then sudo=sudo; fi
            if command -v apt-get > /dev/null 2>&1; then
              $sudo apt-get update -qq && $sudo apt-get install -y -qq xz-utils
            elif command -v dnf > /dev/null 2>&1; then
              $sudo dnf install -y -q xz
            fi
          fi
          xz --version | head -n 1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Report check results
        if: always()
        shell: bash
        run: |
          check_log=$(find . -name 00check.log 2>/dev/null | head -n 1)
          install_log=$(find . -name 00install.out 2>/dev/null | head -n 1)
          if [ -n "$install_log" ]; then
            echo "::notice title=configure::$(grep '^configure:' "$install_log" | awk 'BEGIN { ORS = "%0A" } { print }')"
          fi
          if [ -n "$check_log" ]; then
            echo "::notice title=R CMD check::$(grep -E '^Status:|used C\+\+ compiler|used SDK|\.\.\. .*(NOTE|WARNING|ERROR)' "$check_log" | awk 'BEGIN { ORS = "%0A" } { print }')"
            # Full text of each NOTE, WARNING or ERROR (at most 8), one annotation each.
            awk '
              function flush() { if (keep && n < 8) { print block; n++ }; keep = 0 }
              /^\* / { flush(); line = $0; gsub(/%/, "%25", line); block = line; keep = ($0 ~ /\.\.\. .*(NOTE|WARNING|ERROR)$/); next }
              keep { line = $0; gsub(/%/, "%25", line); block = block "%0A" line }
              END { flush() }
            ' "$check_log" | while IFS= read -r item; do echo "::warning title=R CMD check details::$item"; done
          fi

      - name: Report sanitizer and ODR findings
        if: always()
        shell: bash
        run: |
          # Runtime reports from the undefined-behaviour and address sanitizers
          # in the tests, examples and vignettes, and -Wodr warnings from
          # link-time optimisation, as on CRAN's gcc-ASAN and gcc-UBSAN checks.
          check_log=$(find . -name 00check.log 2>/dev/null | head -n 1)
          [ -n "$check_log" ] || exit 0
          rcheck=$(dirname "$check_log")
          # Only the check's own output: the installation log, the example and
          # test transcripts, and the vignette log (not the package sources).
          outputs=$(find "$rcheck" -maxdepth 2 -type f -not -path '*/00_pkg_src/*' \
            \( -name 00install.out -o -name '*.Rout' -o -name '*.Rout.fail' -o -name '*.log' \) | sort)
          reports=$(printf '%s\n' "$outputs" | xargs grep -h -E 'runtime error:|ERROR: AddressSanitizer' 2>/dev/null \
            | sed -E 's#^.*/lbug-src/#lbug-src/#; s/0x[0-9a-f]+/ADDR/g' \
            | sort | uniq -c | sort -rn || true)
          if [ -n "$reports" ]; then
            n=$(printf '%s\n' "$reports" | wc -l | tr -d ' ')
            msg=$(printf '%s\n' "$reports" | awk 'NR <= 40 { gsub(/%/, "%25"); printf "%s%%0A", $0 }')
            echo "::warning title=Sanitizer reports (${n} distinct)::$msg"
          else
            echo "::notice title=Sanitizer reports::None in: $(printf '%s\n' "$outputs" | sed "s#^$rcheck/##" | tr '\n' ' ')"
          fi
          odr=$(printf '%s\n' "$outputs" | xargs grep -h -E 'One Definition Rule|\[-Wodr\]' 2>/dev/null | sort -u | awk 'NR <= 10' || true)
          if [ -n "$odr" ]; then
            echo "::warning title=ODR warnings::$(printf '%s\n' "$odr" | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
          else
            echo "::notice title=ODR warnings::None"
          fi

      - name: Show why the package could not be built
        if: failure()
        shell: bash
        run: |
          # Only when R CMD check never started (the build failed): rebuild and post
          # the end of the build output, because job logs need admin rights to read.
          if [ -z "$(find . -name 00check.log 2>/dev/null | head -n 1)" ]; then
            R CMD build --no-manual . > build-diagnostic.log 2>&1 || true
            msg=$(tail -n 60 build-diagnostic.log | awk '{ gsub(/\r/, ""); gsub(/%/, "%25"); printf "%s%%0A", $0 }')
            echo "::warning title=R CMD build output (last 60 lines)::$msg"
          fi

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - name: Report check results
        if: always()
        shell: bash
        run: |
          check_log=$(find . -name 00check.log 2>/dev/null | head -n 1)
          install_log=$(find . -name 00install.out 2>/dev/null | head -n 1)
          if [ -n "$install_log" ]; then
            echo "::notice title=configure::$(grep '^configure:' "$install_log" | awk 'BEGIN { ORS = "%0A" } { print }')"
          fi
          if [ -n "$check_log" ]; then
            echo "::notice title=R CMD check::$(grep -E '^Status:|used C\+\+ compiler|used SDK|\.\.\. .*(NOTE|WARNING|ERROR)' "$check_log" | awk 'BEGIN { ORS = "%0A" } { print }')"
            # Full text of each NOTE, WARNING or ERROR (at most 8), one annotation each.
            awk '
              function flush() { if (keep && n < 8) { print block; n++ }; keep = 0 }
              /^\* / { flush(); line = $0; gsub(/%/, "%25", line); block = line; keep = ($0 ~ /\.\.\. .*(NOTE|WARNING|ERROR)$/); next }
              keep { line = $0; gsub(/%/, "%25", line); block = block "%0A" line }
              END { flush() }
            ' "$check_log" | while IFS= read -r item; do echo "::warning title=R CMD check details::$item"; done
          fi
