# Temporary diagnostics; remove before merging.
#
# R-hub's clang23 check (clang 23, libc++, -O3) segfaults in rladybugdb's
# tests at the first C++ exception, yet the same tests run cleanly in that
# container outside R CMD check. This repeats R-hub's check exactly (all
# dependencies, rcmdcheck with --as-cran) for 0.4.5 and for CRAN's 0.4.4, then
# reruns the check's own tests directly and under gdb (address randomization
# left on), and posts the results as annotations.
name: clang libc++ diagnostics

on:
  push:
    branches: ['fix/**']
    paths: ['.github/workflows/clang-diagnostics.yaml']

jobs:
  diagnose:
    name: clang23 R CMD check / rladybugdb ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/r-hub/containers/clang23:latest
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        package: ['0.4.5', '0.4.4']

    steps:
      - uses: actions/checkout@v4

      - name: Install xz and gdb
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq xz-utils gdb > /dev/null

      - name: Use CRAN's 0.4.4 sources
        if: matrix.package == '0.4.4'
        shell: bash
        run: |
          curl -fsSL -o /tmp/rladybugdb_0.4.4.tar.gz https://cran.r-project.org/src/contrib/Archive/rladybugdb/rladybugdb_0.4.4.tar.gz
          echo "b81522b20830e46fa6ed17ba84c12e2bcf94c43537047e16f806a0266cc5cbcb  /tmp/rladybugdb_0.4.4.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/rladybugdb_0.4.4.tar.gz --strip-components=1 -C .
          printf '%s\n' '^\.github$' >> .Rbuildignore
          grep '^Version' DESCRIPTION

      # The same steps as r-hub/actions/setup-deps and run-check.
      - name: Set user library location
        shell: Rscript {0}
        run: |
          dir.create(lib <- Sys.getenv("R_LIBS_USER"), showWarnings = FALSE, recursive = TRUE)
          writeLines(paste0("R_LIBS_USER=", Sys.getenv("R_LIBS_USER")), Sys.getenv("GITHUB_ENV"))

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          pak-version: devel

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: "c('--no-manual', '--as-cran', '--install-args=--build', strsplit(Sys.getenv('CHECK_ARGS'), '[ ]+')[[1]])"
          build_args: "c('--no-manual', strsplit(Sys.getenv('BUILD_ARGS'), '[ ]+')[[1]])"
          upload-results: never
          upload-snapshots: false
          error-on: '"never"'
        env:
          R_KEEP_PKG_SOURCE: yes

      - name: Report the check
        if: always()
        shell: bash
        run: |
          check_log=$(find check -name 00check.log 2>/dev/null | head -n 1)
          [ -n "$check_log" ] || { echo "::warning title=R CMD check::no 00check.log"; exit 0; }
          echo "::notice title=R CMD check::$(grep -E '^Status:|used C\+\+ compiler|checking tests|\.\.\. .*(NOTE|WARNING|ERROR)' "$check_log" | awk 'BEGIN { ORS = "%0A" } { print }')"
          fail=$(find check -name 'testthat.Rout.fail' 2>/dev/null | head -n 1)
          if [ -n "$fail" ]; then
            echo "::warning title=testthat.Rout.fail (first 30 lines)::$(head -n 30 "$fail" | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
          fi

      - name: Rerun the check's tests directly and under gdb
        if: always()
        shell: bash
        run: |
          check_log=$(find check -name 00check.log 2>/dev/null | head -n 1)
          [ -n "$check_log" ] || exit 0
          rcheck=$(cd "$(dirname "$check_log")" && pwd)
          printf '%s\n' 'set pagination off' 'set print thread-events off' \
            'set disable-randomization off' 'run' 'bt' 'x/4i $pc' 'info threads' \
            'thread apply all bt 12' > "$GITHUB_WORKSPACE/gdbcmds"
          cd "$rcheck/tests"
          R_LIBS="$rcheck" R --vanilla -f testthat.R > "$GITHUB_WORKSPACE/direct-tests.log" 2>&1 || true
          R_LIBS="$rcheck" R -d gdb --debugger-args="-batch -x $GITHUB_WORKSPACE/gdbcmds" --vanilla -f testthat.R > "$GITHUB_WORKSPACE/gdb-tests.log" 2>&1 || true
          cd "$GITHUB_WORKSPACE"
          direct=$(grep -E -m 3 'caught segfault|\[ FAIL [0-9]+ \| WARN [0-9]+ \| SKIP [0-9]+ \| PASS [0-9]+ \]' direct-tests.log)
          echo "::warning title=Check tests rerun directly::$(printf '%s\n' "$direct" | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
          if grep -q 'received signal' gdb-tests.log; then
            echo "::warning title=Check tests under gdb: crash::$(grep -E -A 90 'received signal' gdb-tests.log | head -n 120 | awk '{ gsub(/\r/, ""); gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
          else
            echo "::warning title=Check tests under gdb: no crash::$(tail -n 25 gdb-tests.log | awk '{ gsub(/\r/, ""); gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
          fi
